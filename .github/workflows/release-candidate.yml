name: Build release candidate

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Unsigned darwin/arm64 candidate
    runs-on: macos-26
    timeout-minutes: 30
    environment: release-candidate
    permissions:
      contents: read
      id-token: write # mint the short-lived identity used by actions/attest
      attestations: write # store build provenance attestations
    steps:
      - name: Checkout complete tagged history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use exact release Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version-release
          package-manager-cache: false
      - name: Verify the npm bundled with the pinned Node.js release
        run: test "$(npm --version)" = "11.19.0"
      - name: Verify annotated tag and GitHub signature status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="v$(node -p 'require("./package.json").version')"
          [[ "$TAG_NAME" == "$expected" ]]
          [[ "$(git cat-file -t "refs/tags/$TAG_NAME")" == tag ]]
          tag_object="$(git rev-parse "refs/tags/$TAG_NAME")"
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .verification.verified)" == true ]]
      - run: npm ci --ignore-scripts
      - run: npm run test:contracts
      - run: npm run build:release
      - name: Generate GitHub build attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/heatdeath.mjs
            dist/heatdeath
            dist/heatdeath-v*-source.tar.gz
            dist/heatdeath-v*.spdx.json
            dist/SOURCE-PROVENANCE.json
            dist/BUILD-RECIPE.txt
            dist/SHA256SUMS
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heatdeath-${{ github.ref_name }}-unsigned-candidate
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/heatdeath.mjs
            dist/heatdeath
            dist/heatdeath-v*-source.tar.gz
            dist/heatdeath-v*.spdx.json
            dist/SOURCE-PROVENANCE.json
            dist/BUILD-RECIPE.txt
            dist/SHA256SUMS
            dist/ed25519.pub.pem
            dist/ml-dsa-87.pub.pem
            dist/slh-dsa-sha2-128s.pub.pem
