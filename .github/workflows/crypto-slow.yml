name: Scheduled crypto stress

on:
  schedule:
    - cron: "23 17 * * 1,4"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to test (default is the current default-branch commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: crypto-slow-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  slow-properties:
    name: Deterministic property and DoS bounds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout requested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Use release Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version-release
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:slow

  opencv:
    name: OpenCV QR decoder oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout requested revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Use release Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version-release
      - name: Use pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: test/requirements-opencv.txt
      - run: npm ci --ignore-scripts
      - name: Install hash-locked OpenCV oracle
        run: python -m pip install --require-hashes -r test/requirements-opencv.txt
      - run: python test/qr_opencv_oracle.py
