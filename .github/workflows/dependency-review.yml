name: Dependency review

on:
  pull_request:

concurrency:
  group: dependencies-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Vulnerability and provenance review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency graph changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development
          retry-on-snapshot-warnings: true
      - name: Use release Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version-release
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Known vulnerability audit
        run: npm audit --audit-level=moderate
      - name: Registry signature and provenance audit
        run: npm audit signatures --include-attestations
      - name: Compare current crypto outputs with the PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/ci/dependency-compat.sh "$BASE_SHA"
